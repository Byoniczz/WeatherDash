services:
  weatherdash:
    build: .
    container_name: weatherdash
    restart: unless-stopped
    ports:
      # Modifica HOST_PORT nelle variabili ambiente di Portainer se desideri un'altra porta (default: 3005)
      - "${HOST_PORT:-3005}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CARTO_API_KEY=cb1_4q2e_1_a29519003be17de1cdc0c026
    volumes:
      # Cartella fisica sul tuo server host per accedere e recuperare direttamente config e file JSON
      - ${DATA_PATH:-/docker/weatherdash}:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
