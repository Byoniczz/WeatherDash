services:
  weatherdash:
    build: .
    container_name: weatherdash
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CARTO_API_KEY=cb1_4q2e_1_a29519003be17de1cdc0c026
    volumes:
      # Volume persistente per salvare gli indirizzi preferiti e impostazioni
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
